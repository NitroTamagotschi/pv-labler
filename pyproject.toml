[project]
name = "pv-labler"
version = "0.1.0"
description = "Web tool for labeling multispectral solar cell images"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "numpy>=1.26",
    "pillow>=10.0",
    "tifffile>=2024.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-playwright>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = '-m "not ui"'
markers = [
    "ui: browser-based UI tests (Playwright, run with `uv run pytest -m ui`)",
]
